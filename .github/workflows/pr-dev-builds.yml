name: PR dev builds

# Binarios de distribución "dev" por Pull Request: mismos 3 SOs que
# release.yml pero con versión pre-release (p. ej. 0.2.3-dev.pr6) y subidos
# como ARTIFACTS del run (no como release assets) — se descargan desde la
# pestaña del workflow run y expiran solos a los 14 días.

# F17/T89: electron-builder.yml ahora tiene una sección `publish` (github/
# DevKelvin21/proj_minerva) para que el auto-updater tenga feed. Efecto
# secundario aceptado acá: como --publish never NO desactiva la escritura
# de `app-update.yml` (solo desactiva la SUBIDA de assets), los binarios
# dev de este workflow quedan con ese archivo embebido — una AppImage
# `0.7.0-abc1234-dev` va a ofrecer actualizar a la 0.7.0 estable apenas
# salga esa release. Es correcto (la 0.7.0 estable es más nueva por
# semver) y además útil (empuja a probar el build real en vez de quedarse
# en un dev build viejo).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo al PR cancela los builds del push anterior.
concurrency:
  group: pr-dev-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Puerta de calidad: typecheck + lint + unit tests UNA sola vez en Linux.
  # Los builds de la matriz (3 SOs) solo arrancan si esto pasa — mismo
  # pipeline que `npm run verify` en local.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Suite e2e Playwright (e2e/): lanza la app CONSTRUIDA con mocks y userData
  # aislado bajo Xvfb. Solo Linux: la suite controla ella misma el ciclo de
  # vida del proceso Electron (spawn + connectOverCDP, ver e2e/fixtures.ts),
  # así que no necesita browsers de Playwright ni display real. El spec de
  # packaged se auto-skipea (aquí no se corre electron-builder).
  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Ubuntu 24.04 restringe user namespaces sin privilegios (AppArmor) y el
      # sandbox de Electron lanzado desde node_modules muere al arrancar.
      - name: Allow Electron sandbox (unprivileged userns)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build (electron-vite)
        run: npm run build

      - name: E2E (Playwright bajo Xvfb)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npx playwright test

      # Las capturas por test son parte de la verificación (CLAUDE.md):
      # subirlas SIEMPRE, también (sobre todo) cuando la suite falla.
      - name: Upload test-results (capturas)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: linux
            runner: ubuntu-latest
            flag: --linux
            assets: dist/*.AppImage
          - os-name: windows
            runner: windows-latest
            flag: --win
            assets: dist/*.exe
          # macos pineado (no -latest): GitHub está migrando macos-latest a
          # macOS 26 desde 2026-06-15 y no queremos que el entorno de build
          # cambie por sorpresa. Subir de versión a propósito, no por drift.
          - os-name: mac
            runner: macos-15
            flag: --mac
            assets: dist/*.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set dev version
        id: version
        shell: bash
        # 0.2.3 → 0.2.3-c426f14-dev: el SHA corto del commit REAL de la rama
        # (head del PR, NO el merge commit sintético que checkout usa en
        # pull_request) va en la versión, para poder confirmar en el
        # "About" de la app instalada exactamente qué commit se está
        # probando. En workflow_dispatch sí aplica github.sha.
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(cut -c1-7 <<< '${{ github.event.pull_request.head.sha || github.sha }}')"
          DEV_VERSION="${BASE_VERSION}-${SHORT_SHA}-dev"
          npm version --no-git-tag-version "$DEV_VERSION"
          echo "version=$DEV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (electron-vite)
        run: npm run build

      - name: Package (electron-builder)
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload dev binaries
        uses: actions/upload-artifact@v7
        with:
          name: minerva-${{ steps.version.outputs.version }}-${{ matrix.os-name }}
          path: ${{ matrix.assets }}
          retention-days: 14
          if-no-files-found: error
