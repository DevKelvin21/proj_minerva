appId: dev.edygg.minerva
productName: Minerva
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/.env'
  - '!**/.env.*'
  # `@anthropic-ai/claude-agent-sdk` ships a native binary per platform (~250MB
  # each) as an optionalDependency, only so it can run its bundled CLI when no
  # `pathToClaudeCodeExecutable` is given. Minerva ALWAYS passes that option pointing
  # at the system `claude` (`src/main/ai/providers/claude-code-service.ts` +
  # `resolve-cli.ts`), so bundling those binaries would add ~250MB per OS for
  # nothing. The glob matches the platform packages ("claude-agent-sdk-*") but NOT
  # the main JS package ("claude-agent-sdk", ~3.8MB), which is needed for `query()`.
  - '!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'
# Auto-updater feed: this section makes electron-builder write `app-update.yml`
# INSIDE the package (in resources/) with provider/owner/repo embedded. Without it
# `electron-updater` throws at runtime as soon as the app starts (no feed to query).
# The repo is PUBLIC, so the `github` provider needs no credentials for clients to
# READ the feed (the release pipeline does need them to publish, see
# .github/workflows/release.yml). Keep owner/repo in sync with
# `src/main/updater/config.ts`.
publish:
  provider: github
  owner: DevKelvin21
  repo: proj_minerva
asar: true
npmRebuild: false
linux:
  target:
    - AppImage
  category: Development
  executableName: minerva
  maintainer: Edilson
mac:
  category: public.app-category.developer-tools
  # macOS is notify-only for now (no Developer ID yet: the real updater only
  # compares versions and links to the release). The `zip` target is still built
  # because Squirrel.Mac (electron-updater's macOS mechanism) needs it for
  # `latest-mac.yml` to be useful, so the day signing exists nothing here changes.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
